# https://aka.ms/yaml

trigger:
  - main
  - dev

variables:
  - group: s3PushInstallers
  - group: grasshopper-public-repos
  - name: configuration
    value: Release
  - name: DEFAULT_WORKING_DIRECTORY
    value: $(System.DefaultWorkingDirectory)
  - name: PIPELINE_WORKSPACE
    value: $(Pipeline.Workspace)
  - name: SOURCE_BRANCH
    value: $(Build.SourceBranch)
  - name: TARGET_BRANCH
    value: $(System.PullRequest.TargetBranch)
  - name: APPX_PACKAGE_DIRECTORY
    value: $(build.artifactStagingDirectory)\AppxPackages
  - name: RESULTS_DIRECTORY
    value: $(DEFAULT_WORKING_DIRECTORY)\results
  - name: ADSEC_CORE_RESULTS_DIRECTORY
    value: $(RESULTS_DIRECTORY)\adsecCore
  - name: ADSEC_GH_RESULTS_DIRECTORY
    value: $(RESULTS_DIRECTORY)\adsecgh
  - name: INTEGRATION_RESULTS_DIRECTORY
    value: $(RESULTS_DIRECTORY)\integration
  - name: YAK_RESULTS_DIRECTORY
    value: $(RESULTS_DIRECTORY)\yak
  - name: STRYKER_OUTPUT_DIRECTORY
    value: $(DEFAULT_WORKING_DIRECTORY)/StrykerOutput
  - name: COVERLET_ADAPTER_PATH
    value: $(USERPROFILE)\.nuget\packages\coverlet.collector\6.0.2\build

pool: 'rhino-compute'

steps:
  - powershell: |
      Get-ChildItem *.msi -Recurse | Remove-Item
      aws s3 cp s3://oasys-installer-store/GSA/latest . --exclude "*" --include *Arup*.msi --recursive
      Get-ChildItem *.msi | Rename-Item -NewName gsa.msi
    displayName: 'Download GSA latest'
    failOnStderr: true

  - powershell: |
      $installerPath = Get-ChildItem -Path $env:PIPELINE_WORKSPACE\gsa.msi -Recurse
      Write-output "Installer Path: ${installerPath}"
      Write-output "GSA Version:"
      if (!(Test-Path $installerPath.FullName)) {
        Write-output "File '{0}' does not exist" -f $installerPath.FullName
      }
      try {
        $WindowsInstaller = New-Object -com WindowsInstaller.Installer
        $Database = $WindowsInstaller.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $Null, $WindowsInstaller, @($installerPath.FullName, 0))
        $Query = "SELECT Value FROM Property WHERE Property = 'ProductVersion'"
        $View = $database.GetType().InvokeMember("OpenView", "InvokeMethod", $Null, $Database, ($Query))
        $View.GetType().InvokeMember("Execute", "InvokeMethod", $Null, $View, $Null) | Out-Null
        $Record = $View.GetType().InvokeMember( "Fetch", "InvokeMethod", $Null, $View, $Null )
        $Version = $Record.GetType().InvokeMember( "StringData", "GetProperty", $Null, $Record, 1 )
        Write-output $Version
      } catch {
        Write-output "Failed to get MSI file version: {0}." -f $_
      }
      $app = Start-Process ${installerPath} -ArgumentList '/passive /quiet /l* msiLog.txt' -PassThru -Wait
      $app.WaitForExit()
      Write-Output "Exit code: $($app.ExitCode)"
      Write-Output "Exit time: $($app.ExitTime.ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')) UTC"
      if ($app.ExitCode -ne 0) {
        Write-Error "Application could not be installed. Error code $($app.ExitCode)"
        exit(1)
      }
    displayName: 'Install GSA'
    failOnStderr: true

  - powershell: |
      .\download-latest-gsa.ps1
    displayName: Download latest GSA GH
    failOnStderr: true

  - powershell: Remove-Item -Path C:\Users\**\AppData\Roaming\Grasshopper\Libraries\*.ghlink
    displayName: 'Delete orphan .ghlink files'

  - task: NuGetToolInstaller@1

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - task: NuGetCommand@2
    displayName: 'Restoring NuGet packages'
    inputs:
      command: 'restore'
      restoreSolution: 'AdSecGH.sln'

  - task: VSBuild@1
    displayName: 'Building project in $(configuration)'
    inputs:
      solution: 'AdSecGH.sln'
      msbuildArgs: '/p:AppxBundlePlatforms="x64" /p:AppxPackageDir="$(APPX_PACKAGE_DIRECTORY)" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /m /nr:false'
      platform: 'x64'
      configuration: '$(configuration)'
      clean: true
    env:
      MSBUILDDISABLENODEREUSE: 1

  - powershell: |
      dotnet tool install --global dotnet-stryker
    displayName: Install Stryker
    failOnStderr: false

  - task: VSBuild@1
    displayName: 'Re-Building project in $(configuration)'
    inputs:
      solution: 'AdSecGH.sln'
      msbuildArgs: '/p:AppxBundlePlatforms="x64" /p:AppxPackageDir="$(APPX_PACKAGE_DIRECTORY)" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /m /nr:false'
      platform: 'x64'
      configuration: '$(configuration)'
      clean: true
    env:
      MSBUILDDISABLENODEREUSE: 1

  - task: VSTest@3
    displayName: 'dotnet tests AdSecCore'
    inputs:
      testSelector: 'testAssemblies'
      testAssemblyVer2: |
        AdSecCoreTests\bin\x64\Release\net8.0\AdSecCoreTests.dll
      resultsFolder: '$(ADSEC_CORE_RESULTS_DIRECTORY)'
      otherConsoleOptions: '--collect:"XPlat Code Coverage" /TestAdapterPath:"$(COVERLET_ADAPTER_PATH)"'

  - task: VSTest@3
    displayName: 'dotnet tests AdSecGh'
    inputs:
      testSelector: 'testAssemblies'
      testAssemblyVer2: |
        AdSecGHTests\bin\x64\Release\net48\AdSecGHTests.dll
      resultsFolder: '$(ADSEC_GH_RESULTS_DIRECTORY)'
      otherConsoleOptions: '--collect:"XPlat Code Coverage" /TestAdapterPath:"$(COVERLET_ADAPTER_PATH)"'

  - task: VSTest@3
    displayName: 'dotnet tests Integration'
    inputs:
      testSelector: 'testAssemblies'
      testAssemblyVer2: |
        IntegrationTests\bin\x64\Release\net48\IntegrationTests.dll
      resultsFolder: '$(INTEGRATION_RESULTS_DIRECTORY)'
      otherConsoleOptions: '--collect:"XPlat Code Coverage" /TestAdapterPath:"$(COVERLET_ADAPTER_PATH)"'

  - powershell: |
      if (200 -ne (Invoke-WebRequest -Uri https://codecov.io/validate -Body (Get-Content -Raw -LiteralPath .\codecov.yml) -Method post -UseBasicParsing | Select-Object StatusCode).StatusCode) {
        Write-Output "codecov.yml is invalid"
        Invoke-WebRequest -Uri https://codecov.io/validate -Body (Get-Content -Raw -LiteralPath .\codecov.yml) -Method post -UseBasicParsing
        exit(1)
      } else {
        Write-Output "codecov.yml is valid"
      }
    displayName: Validate codecov.yml
    failOnStderr: true

  - powershell: |
      $coverage_file_adsecCore = (Resolve-Path (Join-Path $env:RESULTS_DIRECTORY 'adsecCore/*/coverage.cobertura.xml')).Path
      echo $coverage_file_adsecCore
      $coverage_file_adsecgh = (Resolve-Path (Join-Path $env:RESULTS_DIRECTORY 'adsecgh/*/coverage.cobertura.xml')).Path
      echo $coverage_file_adsecgh
      $coverage_file_integration = (Resolve-Path (Join-Path $env:RESULTS_DIRECTORY 'integration/*/coverage.cobertura.xml')).Path
      echo $coverage_file_integration

      Copy-Item $coverage_file_adsecCore (Join-Path $env:RESULTS_DIRECTORY 'coverage_adsecCore.xml')
      Copy-Item $coverage_file_adsecgh (Join-Path $env:RESULTS_DIRECTORY 'coverage_adsecgh.xml')
      Copy-Item $coverage_file_integration (Join-Path $env:RESULTS_DIRECTORY 'coverage_integration.xml')
      $ProgressPreference = 'SilentlyContinue'
      Invoke-WebRequest -Uri https://uploader.codecov.io/latest/windows/codecov.exe -Outfile codecov.exe
      Get-ChildItem $env:DEFAULT_WORKING_DIRECTORY
      Set-Location $env:DEFAULT_WORKING_DIRECTORY
      .\codecov -t $env:CODECOV_TOKEN --dir $env:RESULTS_DIRECTORY --file coverage_adsecCore.xml -F adsecCore
      .\codecov -t $env:CODECOV_TOKEN --dir $env:RESULTS_DIRECTORY --file coverage_adsecgh.xml -F adsecgh
      .\codecov -t $env:CODECOV_TOKEN --dir $env:RESULTS_DIRECTORY --file coverage_integration.xml -F adsecgh_integration
    env:
      CODECOV_TOKEN: $(CODECOV_TOKEN)
    displayName: Upload Code Coverage to codecovio
    failOnStderr: true

  - powershell: |
      $jsonPath = "stryker-config.json"
      $branchPattern = '^(refs/heads/[0-9A-Za-z._/-]+|[0-9A-Za-z._/-]+)$'

      # Get PR target or fallback
      $fullBranch = $env:TARGET_BRANCH
      if (-not $fullBranch) {
        $fullBranch = $env:SOURCE_BRANCH
      }

      if ($fullBranch -notmatch $branchPattern) {
        throw "Unexpected branch ref format: $fullBranch"
      }

      $branchName = $fullBranch -replace '^refs/heads/', ''
      $originBranch = "origin/$branchName"

      Write-Host "Using Stryker since target: $originBranch"

      # Load and modify JSON safely
      $json = Get-Content $jsonPath | ConvertFrom-Json
      if ($json."stryker-config".since) {
        $json."stryker-config".since.target = $originBranch
        # Save updated JSON back to file
        $json | ConvertTo-Json -Depth 10 | Set-Content $jsonPath -Encoding UTF8
      } else {
        Write-Host "Skipping target injection because 'since' block is removed."
      }
    displayName: "Update stryker-config.json target branch"
    condition: ne(variables['System.PullRequest.TargetBranch'], '')

  - powershell: |
      $branchPattern = '^(refs/heads/[0-9A-Za-z._/-]+|[0-9A-Za-z._/-]+)$'

      # Get the target branch name from Azure DevOps metadata
      $targetBranch = if ($env:TARGET_BRANCH) { $env:TARGET_BRANCH } else { 'main' }

      if ($targetBranch -notmatch $branchPattern) {
        throw "Unexpected branch ref format: $targetBranch"
      }

      $targetBranch = $targetBranch -replace '^refs/heads/', ''

      Write-Host "Calculating PR modifications against origin/$targetBranch..."

      # Extract changed AdSecCore C# files and format paths for Stryker.
      # Stryker expects mutate paths relative to the mutated project's root, not the repo root.
      $changedFiles = git diff --name-only origin/$targetBranch...HEAD -- "*.cs" |
        ForEach-Object { $_ -replace '\\', '/' } |
        Where-Object { $_ -like 'AdSecCore/*.cs' }

      if ($changedFiles) {
          $mutateFiles = $changedFiles | ForEach-Object { $_ -replace '^AdSecCore/', '' }

          # Format multiple files into a clean comma-separated list
          $mutateArg = $mutateFiles -join ','
          Write-Host "Fast PR Optimization Active. Targeted repo files: $($changedFiles -join ',')"
          Write-Host "Stryker mutate filter: $mutateArg"

          # Execute Stryker focusing ONLY on the PR modifications
          dotnet stryker -s AdSecCore.sln --project AdSecCore/AdSecCore.csproj --test-project AdSecCoreTests/AdSecCoreTests.csproj --mutate "$mutateArg" -l advanced *>&1 | Tee-Object -FilePath "stryker.log"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Stryker task failed!"
            Write-Host "##vso[task.setvariable variable=mutationScore]N/A"
            Write-Host "##vso[task.setvariable variable=mutationStatus]💥"
            exit 1
          }

          # Parse out the mutation score from the recorded log file
          $logContent = Get-Content -Path "stryker.log" -Raw
          $scoreLine = $logContent | Select-String -Pattern 'final mutation score is (\d+(\.\d+)?) ?%'

          if ($scoreLine) {
            $matches = [regex]::Match($scoreLine.Line, 'final mutation score is (\d+(\.\d+)?) ?%')
            $score = [double]$matches.Groups[1].Value
            $status = if ($score -ge 50) { "✅" } else { "❌" }

            Write-Host "##vso[task.setvariable variable=mutationScore]$score"
            Write-Host "##vso[task.setvariable variable=mutationStatus]$status"
          } else {
            Write-Host "No score found"
            Write-Host "##vso[task.setvariable variable=mutationScore]N/A"
            Write-Host "##vso[task.setvariable variable=mutationStatus]➖"
          }
      } else {
          # If no AdSecCore C# code changed, skip execution instantly to prevent long runs.
          Write-Warning "No AdSecCore C# file changes detected in this PR. Skipping mutation testing execution entirely."
          Write-Host "##vso[task.setvariable variable=mutationScore]N/A"
          Write-Host "##vso[task.setvariable variable=mutationStatus]➖"
      }
    displayName: Run Stryker
    failOnStderr: false

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Stryker Mutation Report'
    condition: and(succeeded(), ne(variables['mutationStatus'], '➖'), ne(variables['mutationStatus'], '💥'))
    inputs:
      pathToPublish: '$(STRYKER_OUTPUT_DIRECTORY)/'
      artifactName: 'StrykerReport'

  - task: PublishMutationReport@2
    displayName: 'Publish Mutation Test Report'
    condition: and(succeeded(), ne(variables['mutationStatus'], '➖'), ne(variables['mutationStatus'], '💥'))
    inputs:
      reportPattern: '$(STRYKER_OUTPUT_DIRECTORY)/**/mutation-report.html'
      reportDisplayName: 'Mutation Report'

  - task: GitHubComment@0
    inputs:
      gitHubConnection: 'github-connection'  # Replace with your service connection name
      repositoryName: 'arup-group/AdSec-Grasshopper'   # Format: 'owner/repo'
      comment: |
        $(mutationStatus) Mutation testing complete.
        **Score**: $(mutationScore)%
        View the [Stryker report](https://dev.azure.com/oasys-software/OASYS%20libraries/_build/results?buildId=$(Build.BuildId)&view=stryker-mutator.mutation-report-publisher.mutation-report-tab) for details.
    displayName: 'Post comment to GitHub PR'

  - task: PowerShell@2
    displayName: Check for existing tags
    inputs:
      targetType: 'inline'
      script: |
        $versionInfo = $(Get-Item .\AdSecGH\bin\x64\Release\net48\AdSecGH.dll).VersionInfo
        echo $versionInfo
        $fullVersion = [array]${versionInfo}.FileVersion.split('.')
        $currentTime = $(Get-Date -Format "dddd MM/dd/yyyy HH:mm")
        $majorVersion = [string]$fullVersion[0]
        $minorVersion = [string]$fullVersion[1]
        $spVersion = [string]$fullVersion[2]
        $buildNumber = [string]$fullVersion[3]

        $tag = [array]@($exeName,$majorVersion,$minorVersion,$spVersion,$buildNumber)
        $tagNumbersOnly = [array]@($majorVersion,$minorVersion,$spVersion,$buildNumber)

        $dotSeparatedTag = $majorVersion + "." + $minorVersion + "." + $spVersion + "-beta"
        $underscoreSeparatedTag = $majorVersion + "_" + $minorVersion + "_" + $spVersion + "_" + $buildNumber
        $tagNumbersOnlyUnderscore = $majorVersion + "_" + $minorVersion + "_" + $spVersion + "_" + $buildNumber
        $tagNumbersOnlydot = $majorVersion + "." + $minorVersion + "." + $spVersion + "." + $buildNumber

        Write-Host ("##vso[task.setvariable variable=dotSeparatedTag]$dotSeparatedTag")
        git rev-parse $dotSeparatedTag
        if($lastExitCode -eq 0){Write-Host ("##vso[task.setvariable variable=TAG_EXISTS]true")}
        if($lastExitCode -eq 0){
          $tagExists = 'true'
          echo $tagExists
        }
      errorActionPreference: 'continue'
      workingDirectory: '$(DEFAULT_WORKING_DIRECTORY)'
      ignoreLASTEXITCODE: true

  - powershell: |
      cd AdSecGH\bin\x64\Release
      curl https://files.mcneel.com/yak/tools/latest/yak.exe -o yak.exe
      .\yak version
      cd net48
      ..\yak spec
      Add-Content manifest.yml 'icon: AdSecIcon.png'
      Add-Content manifest.yml 'keywords:'
      Add-Content manifest.yml '- oasys'
      Add-Content manifest.yml '- adsec'
      Add-Content manifest.yml '- adsecgh'
      Add-Content manifest.yml '- section'
      Add-Content manifest.yml '- concrete'
      Add-Content manifest.yml '- composite'
      Add-Content manifest.yml '- structural'
      Add-Content manifest.yml '- concreteanalysis'
      Add-Content manifest.yml '- structuraldesign'
      ..\yak build --platform win
      $yakCurrentVersName = Get-ChildItem -Path . -Filter "*.yak"
      $yakRh7Name =  $yakCurrentVersName -Replace "rh6_27", "rh7_0"
      Rename-Item -Path $yakCurrentVersName -NewName $yakRh7Name
      ..\yak build --platform win

      New-Item -ItemType Directory -Path $env:YAK_RESULTS_DIRECTORY
      Copy-Item $yakCurrentVersName (Join-Path $env:YAK_RESULTS_DIRECTORY $yakCurrentVersName)
      Copy-Item $yakRh7Name (Join-Path $env:YAK_RESULTS_DIRECTORY $yakRh7Name)
    displayName: Package yak

  - publish: $(YAK_RESULTS_DIRECTORY)
    displayName: Publish Yak Package to Azure
    artifact: Yak Package
    continueOnError: false

  - powershell: |
      Remove-Item $env:YAK_RESULTS_DIRECTORY -Recurse -Force
    displayName: Remove Yak from Results

  - powershell: |
      cd AdSecGH
      & 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\amd64\MSBuild.exe' AdSecGH.csproj /t:pack /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg /p:DebugType=portable /property:Configuration=Debug
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables.TAG_EXISTS, 'true'))
    displayName: Package NuGet

  - task: GitHubRelease@1
    inputs:
      gitHubConnection: 'github.com_MJCramp'
      repositoryName: 'arup-group/AdSec-Grasshopper'
      action: 'edit'
      target: '$(Build.SourceVersion)'
      tag: '$(dotSeparatedTag)'
      title: 'AdSecGH version $(dotSeparatedTag)'
      releaseNotesSource: 'inline'
      releaseNotesInline: |
        Created from commit https://github.com/arup-group/AdSec-Grasshopper/commit/$(Build.SourceVersion)
      assets: |
        $(DEFAULT_WORKING_DIRECTORY)/**/*.yak
        $(DEFAULT_WORKING_DIRECTORY)/**/*.nupkg
        $(DEFAULT_WORKING_DIRECTORY)/**/*.snupkg
      assetUploadMode: 'replace'
      isDraft: true
      isPreRelease: true
      addChangeLog: false
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables.TAG_EXISTS, 'true'))
    displayName: 'Publishing assets to Github'
